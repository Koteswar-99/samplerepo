name: Test Workflow
on:
  push: null
  
jobs:
    InstallJava:
      runs-on: windows-latest
      steps:
        # - name: Checkout code
        #   uses: actions/checkout@v4
        - name: Install Java 25
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: '25'
        - name: Verify Java Installation
          run: |
            java -version
            javac -version
